<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden; /* evita cualquier scroll */
			}

			img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover; /* cubre toda la pantalla sin deformarse */
				object-position: center;
			}
		</style>
	</head>
	<body>
		<img src="bdimg.png" alt="" />
	</body>
</html>
